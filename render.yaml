# Deploy the HouseWatch risk engine + dashboard on Render's free tier.
services:
  - type: web
    name: housewatch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SEED_DEMO       # auto-fill the dashboard on boot so the live demo isn't empty
        value: "1"
